[project]
name = "argentum-vault-protocol"
version = "0.1.0"
description = "Vyper stablecoin vault with epoch-based withdrawals and reserve liquidity controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "titanoboa>=0.2.8",
    "vyper>=0.4.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
